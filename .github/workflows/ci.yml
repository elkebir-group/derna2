name: CI
on:
  push:
  pull_request:
  # macOS runs on these two events rather than on every push. See below.
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

# A newer push to the same branch makes the older run's answer worthless, so
# the older run is cancelled rather than paid for.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Read-only unless a job below says otherwise.
permissions:
  contents: read

# Releases arrive on the `candidate` branch, one commit on top of `main`. The
# `linux` job is the gate; on green, `promote` fast-forwards `main` to the
# candidate and makes the release its `Release-Tag:` trailer names. On red,
# `main` is untouched and `report` records the failure on one open issue.
jobs:
  linux:
    runs-on: ubuntu-latest
    # Well above the suite's own time and well below the six-hour default. A
    # test that waits instead of working reports a timeout rather than a
    # reason whatever the limit is, so the only thing this number buys is how
    # long it takes to learn that — and six hours of it buys nothing.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      # Tests build under the `ci` profile: release optimization without LTO,
      # 1m58s against 13m57s for the same build under `--release`. The
      # shipping binary is built once under `release` below, so the
      # configuration users get is still shown to compile.
      - run: cargo clippy --profile ci --workspace --all-targets -- -D warnings
      - run: cargo test --profile ci --workspace
      - run: cargo build --release -p derna --bin derna

  macos:
    # macOS is tested because the support is conditional compilation — a
    # jemalloc dependency and a thread-CPU clock that only Linux has — and
    # conditional compilation that nothing builds stops compiling without
    # anything failing. What it is *not* is a per-push gate: a macOS minute
    # bills at ten times a Linux one, and the platform's own defects have all
    # been in code that compiles for it and behaves differently when run, which
    # a weekly run catches as surely as a per-push one.
    #
    # `workflow_dispatch` is the half that matters when a change touches the
    # conditional code: run it then, rather than waiting for the Monday run.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --profile ci --workspace --all-targets -- -D warnings
      - run: cargo test --profile ci --workspace

  promote:
    needs: linux
    if: github.event_name == 'push' && github.ref == 'refs/heads/candidate'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # A commit that changes a file under `.github/workflows` can only be
          # moved onto `main` by a token with the workflows permission, which
          # the built-in token never has. Without the secret, such a release
          # fails here and is reported below, and every other one goes through.
          token: ${{ secrets.PROMOTE_TOKEN || github.token }}
      # A plain push refuses anything but a fast-forward, so a `main` that
      # moved since the candidate was made is reported, never overwritten.
      - name: Fast-forward main to the candidate
        run: git push origin "${GITHUB_SHA}:refs/heads/main"
      - name: Make the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(git log -1 --format='%(trailers:key=Release-Tag,valueonly)' "$GITHUB_SHA" | head -n 1 | tr -d '[:space:]')
          if [ -z "$tag" ]; then
            echo "no Release-Tag trailer: main moved, no release made"
            exit 0
          fi
          if ! [[ $tag =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release-Tag '$tag' is not of the form vX.Y.Z" >&2
            exit 1
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "release $tag already exists"
            exit 0
          fi
          git log -1 --format=%B "$GITHUB_SHA" >"$RUNNER_TEMP/notes.md"
          gh release create "$tag" --target "$GITHUB_SHA" --title "$tag" --notes-file "$RUNNER_TEMP/notes.md"

  report:
    needs: [linux, promote]
    if: failure() && github.event_name == 'push' && github.ref == 'refs/heads/candidate'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      issues: write
    steps:
      - name: Record the failure on the tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          title="Release candidate did not pass"
          run="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          body="Candidate \`$GITHUB_SHA\` did not reach \`main\`; \`main\` is unchanged. Gate: ${{ needs.linux.result }}, promotion: ${{ needs.promote.result }}. Run: $run"
          n=$(gh issue list --state open --search "\"$title\" in:title" --json number,title \
            --jq "[.[] | select(.title == \"$title\")][0].number // empty")
          if [ -n "$n" ]; then
            gh issue comment "$n" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
