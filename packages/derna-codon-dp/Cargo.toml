[package]
name = "derna-codon-dp"
version = "0.1.0"
description = "Pareto-optimal codon design via DERNA's BRD / PORD dynamic programs"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
rna-mfe = { path = "../rna-mfe" }
thiserror = "2.0"
serde_json = "1"
smallvec = "1"
dhat = { version = "0.3", optional = true }

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
hex = "0.4"

[features]
dhat-heap = ["dep:dhat"]
