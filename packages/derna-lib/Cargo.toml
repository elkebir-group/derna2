[package]
name = "derna-lib"
version = "0.1.0"
description = "Beam-search codon design: a codon-DFA composed with a LinearFold-style 5'-to-3' CKY scan"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
rna-mfe = { path = "../rna-mfe" }
derna-codon-dp = { path = "../derna-codon-dp" }
thiserror = "2.0"
serde_json = "1"
smallvec = "1"
tikv-jemallocator = "0.6"
# The purge in `motif_front` calls `mallctl` through this crate rather than
# through an `extern` block of its own, so that the crate providing the symbol
# is a real dependency of this library and is not dropped from the link.
tikv-jemalloc-sys = "0.6"
libc = "0.2"

[features]
# Diagnostic builds; neither changes an answer.
# `alloc-census`: link the allocation census (`DERNA_ALLOC_COUNT`) over
# jemalloc.
alloc-census = []
# `system-alloc`: run under the system allocator instead of jemalloc.
system-alloc = []

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
